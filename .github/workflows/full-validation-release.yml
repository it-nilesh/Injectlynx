name: Full validation and release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CONFIGURATION: Release
  DOTNET_NOLOGO: true
  MAIN_PACKAGE_MAJOR_MINOR: 1.0
  RELEASE_BRANCH: main

jobs:
  validate:
    name: Build, test, package, samples, and Native AOT
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Injectlynx.slnx

      - name: Build
        run: dotnet build Injectlynx.slnx -c "$CONFIGURATION" --no-restore -m:1 -nr:false

      - name: Validate reserved tooling projects
        run: |
          dotnet build src/Injectlynx.Analyzers/Injectlynx.Analyzers.csproj -c "$CONFIGURATION" --no-restore
          dotnet build src/Injectlynx.CodeFixes/Injectlynx.CodeFixes.csproj -c "$CONFIGURATION" --no-restore
          dotnet run --project src/Injectlynx.Cli/Injectlynx.Cli.csproj -c "$CONFIGURATION" --no-build -- --help

      - name: Test
        run: dotnet test Injectlynx.slnx -c "$CONFIGURATION" --no-build --no-restore -m:1 -nr:false

      - name: Pack primary package
        run: dotnet pack src/Injectlynx/Injectlynx.csproj -c "$CONFIGURATION" --no-build -o artifacts/packages

      - name: Verify release package contents
        run: bash eng/release/verify-packages.sh

      - name: Verify dependency vulnerabilities
        run: bash eng/release/verify-vulnerabilities.sh

      - name: Generate SBOM
        run: bash eng/release/generate-sbom.sh

      - name: Verify package payload manifests
        run: bash eng/release/verify-package-manifests.sh

      - name: Verify reproducible packages
        run: bash eng/release/verify-reproducible-packages.sh

      - name: Validate local consumer package
        run: bash eng/validation/validate-local-package.sh

      - name: Validate Minimal API sample
        run: |
          dotnet build samples/MinimalApi/MinimalApi.csproj -c "$CONFIGURATION" -f net8.0 --no-restore
          dotnet build samples/MinimalApi/MinimalApi.csproj -c "$CONFIGURATION" -f net9.0 --no-restore
          dotnet build samples/MinimalApi/MinimalApi.csproj -c "$CONFIGURATION" -f net10.0 --no-restore

      - name: Validate Web API sample
        run: bash eng/validation/validate-webapi-sample.sh

      - name: Validate Worker Service sample
        run: bash eng/validation/validate-worker-service-sample.sh

      - name: Install Native AOT toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev binutils

      - name: Validate Native AOT sample
        run: bash eng/validation/validate-native-aot.sh linux-x64 net10.0

  pack:
    name: Pack NuGet package
    runs-on: ubuntu-latest
    needs: validate
    if: github.repository == 'it-nilesh/Injectlynx'
    outputs:
      package-version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Release tags must use vMAJOR.MINOR.PATCH, for example v1.0.1."
              exit 1
            fi
          else
            version="${MAIN_PACKAGE_MAJOR_MINOR}.${GITHUB_RUN_NUMBER}"
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Packing version ${version}"

      - name: Restore
        run: dotnet restore Injectlynx.slnx

      - name: Build
        run: dotnet build Injectlynx.slnx -c "$CONFIGURATION" --no-restore -m:1 -nr:false -p:Version="${{ steps.version.outputs.version }}"

      - name: Pack primary package
        run: dotnet pack src/Injectlynx/Injectlynx.csproj -c "$CONFIGURATION" --no-build -o artifacts/packages -p:Version="${{ steps.version.outputs.version }}"

      - name: Verify package contents
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: bash eng/release/verify-packages.sh

      - name: Verify package payload manifests
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: bash eng/release/verify-package-manifests.sh

      - name: Verify local consumer package
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: bash eng/validation/validate-local-package.sh

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: injectlynx-packages-${{ steps.version.outputs.version }}
          path: |
            artifacts/packages/*.nupkg
            artifacts/checksums/*.sha256
            artifacts/manifests/*.sha256
          if-no-files-found: error

  publish:
    name: Publish NuGet package and GitHub release
    runs-on: ubuntu-latest
    needs: pack
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'it-nilesh/Injectlynx'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Verify release tag is on release branch
        shell: bash
        run: |
          git fetch origin "$RELEASE_BRANCH"

          tag_commit="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          release_branch_commit="$(git rev-parse "origin/$RELEASE_BRANCH")"

          if ! git merge-base --is-ancestor "$tag_commit" "$release_branch_commit"; then
            echo "Release tag ${GITHUB_REF_NAME} must point to a commit contained in origin/${RELEASE_BRANCH}."
            exit 1
          fi

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: injectlynx-packages-*
          path: artifacts
          merge-multiple: true

      - name: Validate NuGet API key
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [[ -z "${NUGET_API_KEY}" ]]; then
            echo "NUGET_API_KEY repository secret is required to publish packages."
            exit 1
          fi

      - name: Publish package to nuget.org
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          for package in artifacts/packages/*.nupkg; do
            dotnet nuget push "$package" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      - name: Write release notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"

          cat > release-notes.md <<EOF
          Injectlynx ${version} publishes the current stable compile-time dependency injection package to NuGet.org.

          ## NuGet Package

          - [Injectlynx](https://www.nuget.org/packages/Injectlynx)

          ## Supported Application Targets

          - .NET 8
          - .NET 9
          - .NET 10
          EOF

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --title "Injectlynx ${tag}" \
              --notes-file release-notes.md
            gh release upload "$tag" artifacts/packages/*.nupkg artifacts/checksums/*.sha256 artifacts/manifests/*.sha256 --clobber
          else
            gh release create "$tag" artifacts/packages/*.nupkg artifacts/checksums/*.sha256 artifacts/manifests/*.sha256 \
              --title "Injectlynx ${tag}" \
              --notes-file release-notes.md \
              --verify-tag
          fi

  publish-unlisted:
    name: Publish unlisted NuGet package
    runs-on: ubuntu-latest
    needs: pack
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'it-nilesh/Injectlynx'

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: injectlynx-packages-*
          path: artifacts
          merge-multiple: true

      - name: Validate NuGet API key
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [[ -z "${NUGET_API_KEY}" ]]; then
            echo "NUGET_API_KEY repository secret is required to publish packages."
            exit 1
          fi

      - name: Publish package to nuget.org as unlisted
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          PACKAGE_VERSION: ${{ needs.pack.outputs.package-version }}
        run: |
          for package in artifacts/packages/*.nupkg; do
            dotnet nuget push "$package" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

          dotnet nuget delete Injectlynx "$PACKAGE_VERSION" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --non-interactive
